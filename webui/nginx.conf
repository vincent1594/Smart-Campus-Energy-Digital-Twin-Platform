server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 靜態資源(echarts/antd 大 chunk)長期快取
  location /assets/ {
    expires 7d;
    add_header Cache-Control "public, immutable";
  }

  # index.html 與未帶 hash 的預算資料檔:強制每次以 ETag 重新驗證,
  # 否則瀏覽器「啟發式快取」會沿用舊檔(新 bundle 換不到、日曲線母線潮流吃到舊資料)。
  # 用 exact-match(=)優先權最高,不影響 /assets/ 的長期快取。
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
  location = /forecast-day.json {
    add_header Cache-Control "no-cache";
  }

  # API 反代到後端容器(compose 服務名 api);前端走相對路徑 → 免 CORS
  location /api/ {
    proxy_pass http://api:8126;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;   # 後端首請求可能仍在建模/暖機
  }

  # SPA fallback(取代 public/_redirects 的 /* → /index.html)
  # 注意:不可用 $uri/ —— 前端路由 /assets 會與 Vite 靜態資料夾 /assets/ 撞名,
  # $uri/ 命中該實體資料夾 → 伺服目錄(無 index.html)→ 設備查詢頁重新整理 403。
  # 真正的靜態檔由上方 location /assets/ 處理;此處只需 檔案不存在就回 index.html。
  location / {
    try_files $uri /index.html;
  }
}
