server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 靜態資源(echarts/antd 大 chunk)長期快取
  location /assets/ {
    expires 7d;
    add_header Cache-Control "public, immutable";
  }

  # API 反代到後端容器(compose 服務名 api);前端走相對路徑 → 免 CORS
  location /api/ {
    proxy_pass http://api:8126;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;   # 後端首請求可能仍在建模/暖機
  }

  # SPA fallback(取代 public/_redirects 的 /* → /index.html)
  location / {
    try_files $uri $uri/ /index.html;
  }
}
